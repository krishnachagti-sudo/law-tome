name: Deploy Law Tome to GitHub Pages

on:
  push:
    branches: [main, claude/engine-plan-task-2-verify-pevw4a]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lawtome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      # Build for the CANONICAL production URL, not the Pages preview URL.
      #
      # The artifact is served at conyso.com/lawtome/, so every canonical, sitemap
      # entry, OG card URL and asset path must say that. Building with the
      # <owner>.github.io/<repo>/ preview origin instead would publish 1,100+ pages
      # canonicalised to the wrong host and force a full migration later.
      #
      # NOTE: a subpath on a custom domain cannot come from GitHub Pages alone — a
      # Pages custom domain serves at the domain ROOT. conyso.com must rewrite
      # /lawtome/* onto this Pages deployment (Cloudflare/Netlify/equivalent). That
      # same layer is what makes dist/_headers (CSP, nosniff, immutable asset
      # caching) take effect; Pages serves no custom headers.
      #
      # Overridable so a fork or a staging host can still build for its own URL.
      - run: npm run build -- --base=${{ vars.SITE_BASE || '/lawtome/' }} --origin=${{ vars.SITE_ORIGIN || 'https://conyso.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lawtome/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
