name: Deploy Law Tome to GitHub Pages

on:
  push:
    branches: [main, claude/engine-plan-task-2-verify-pevw4a]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lawtome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      # GitHub Pages project sites serve at https://<owner>.github.io/<repo>/, which
      # differs from the canonical production origin+base baked into site.config.json.
      # Override both for this build so canonical/og/sitemap URLs point at the host
      # that actually serves the pages.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/ --origin=https://${{ github.repository_owner }}.github.io
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lawtome/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
