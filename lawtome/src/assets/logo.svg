<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="The Law Tome">
  <title>The Law Tome</title>
  <rect width="512" height="512" rx="96" fill="#e7e1d1"/>
  <g fill="none" stroke="#0c0b09" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- open tome: two symmetric pages meeting at a central spine -->
    <path d="M256 152 C 210 132, 150 132, 112 150 L 112 356 C 150 338, 210 338, 256 358 Z"/>
    <path d="M256 152 C 302 132, 362 132, 400 150 L 400 356 C 362 338, 302 338, 256 358 Z"/>
    <line x1="256" y1="152" x2="256" y2="358"/>
    <!-- lines of text suggested on each page -->
    <g stroke-width="11">
      <line x1="150" y1="196" x2="222" y2="188"/>
      <line x1="150" y1="236" x2="222" y2="228"/>
      <line x1="150" y1="276" x2="222" y2="268"/>
      <line x1="290" y1="188" x2="362" y2="196"/>
      <line x1="290" y1="228" x2="362" y2="236"/>
      <line x1="290" y1="268" x2="362" y2="276"/>
    </g>
  </g>
</svg>
